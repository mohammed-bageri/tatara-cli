name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tatara:slot ci-setup
      - run: cp .env.example .env
      # tatara:slot ci-services
      - run: __PM_RUN__ verify

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # catch a broken Dockerfile on the PR, not at deploy
      - run: docker build --tag app:ci .
